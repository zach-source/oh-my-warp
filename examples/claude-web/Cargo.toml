# Independent of the `warp` workspace (empty [workspace] table) so it never
# affects the main build — same pattern as examples/agent-grpc-backend.
[workspace]

[package]
name = "claude-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
